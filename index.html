const GENEROS = [...Array.from(new Set(FILMES.flatMap(f => f.generos))).sort()];

/* ---------- Ícones ---------- */
function nivelCritica(nota) {
  if (nota >= 75) return { id: "certificado", nome: "Certificado de Frescor", desc: "Selo supremo de aclamação da imprensa" };
  if (nota >= 60) return { id: "fresco", nome: "Fresco", desc: "Aprovado pela maioria dos críticos" };
  return { id: "podre", nome: "Podre", desc: "Não recomendado pela crítica" };
}

function Tomate({ nota, size = 22 }) {
  const nivel = nivelCritica(nota).id;
  if (nivel === "certificado") return (
    <svg width={size} height={size} viewBox="0 0 32 32" aria-hidden="true">
      <path d="M10 22 l-3 9 4-2 2 3 3-8z M22 22 l3 9 -4-2 -2 3 -3-8z" fill="#b8892b" />
      <circle cx="16" cy="15" r="14" fill="#d4af37" />
      <circle cx="16" cy="15" r="11.5" fill="none" stroke="#8a6416" strokeWidth="1" strokeDasharray="2 1.6" />
      <ellipse cx="16" cy="16.5" rx="8" ry="7" fill="var(--tomato)" />
      <ellipse cx="13" cy="14" rx="2" ry="1.3" fill="#fff" opacity=".4" />
      <path d="M16 10 l-3.2 -2 2.6 2.6 -3.8 0 3.8 1.3 -2 2.6 2.6 -2 2.6 2 -2 -2.6 3.8 -1.3 -3.8 0 2.6 -2.6z" fill="#3f7a1e" />
    </svg>
  );
  if (nivel === "fresco") return (
    <svg width={size} height={size} viewBox="0 0 32 32" aria-hidden="true">
      <ellipse cx="16" cy="18.5" rx="12.5" ry="11" fill="var(--tomato)" />
      <ellipse cx="11" cy="14" rx="3" ry="2" fill="#fff" opacity=".35" />
      <path d="M16 8 l-5 -3 4 4 -6 0 6 2 -3 4 4 -3 4 3 -3 -4 6 -2 -6 0 4 -4z" fill="#5a9a2e" />
    </svg>
  );
  return (
    <svg width={size} height={size} viewBox="0 0 32 32" aria-hidden="true">
      <path d="M4 20 C3 12 10 9 14 12 C16 7 25 8 27 14 C31 17 29 26 22 27 C18 30 12 29 9 27 C4 27 2 24 4 20Z" fill="var(--rot)" />
      <circle cx="12" cy="18" r="1.6" fill="#3f5f1f" /><circle cx="20" cy="21" r="2" fill="#3f5f1f" /><circle cx="18" cy="14" r="1.2" fill="#3f5f1f" />
    </svg>
  );
}

function Pipoca({ nota, size = 22 }) {
  const cheia = nota >= 60;
  return (
    <svg width={size} height={size} viewBox="0 0 32 32" aria-hidden="true">
      {cheia ? (
        <g fill="var(--corn)">
          <circle cx="10" cy="10" r="4.2" /><circle cx="16" cy="7.5" r="4.6" /><circle cx="22" cy="10" r="4.2" /><circle cx="13" cy="13" r="3.6" /><circle cx="19" cy="13" r="3.6" />
        </g>
      ) : (
        <g fill="var(--corn)" opacity=".55"><circle cx="11" cy="14" r="2.4" /><circle cx="20" cy="15" r="2" /></g>
      )}
      <path d="M6 14 h20 l-3 16 h-14z" fill={cheia ? "#e5e0dc" : "#6b6163"} />
      <path d="M11 14 l1 16 M16 14 v16 M21 14 l-1 16" stroke="var(--tomato)" strokeWidth="2" />
      {!cheia && <path d="M7 20 l18 -4" stroke="#3a2f31" strokeWidth="2" />}
    </svg>
  );
}

function Notas({ filme, grande = false }) {
  const s = grande ? 30 : 22;
  return (
    <div className={`flex items-center ${grande ? "gap-6" : "gap-4"}`}>
      <div className="flex items-center gap-1.5" title={`Tomatômetro: ${nivelCritica(filme.critica).nome} (${nivelCritica(filme.critica).desc})`}>
        <Tomate nota={filme.critica} size={s} />
        <div className="leading-none">
          <div className={`font-mono font-bold nums ${grande ? "text-2xl" : "text-base"}`}>{filme.critica}%</div>
          {grande && <div className="text-[11px] uppercase tracking-wider text-mute mt-1">{nivelCritica(filme.critica).id === "certificado" ? <span className="text-[#d4af37]">Certificado de Frescor</span> : `Tomatômetro · ${nivelCritica(filme.critica).nome}`}</div>}
        </div>
      </div>
      <div className="flex items-center gap-1.5" title="Nota da Audiência: % do público que gostou">
        <Pipoca nota={filme.publico} size={s} />
        <div className="leading-none">
          <div className={`font-mono font-bold nums ${grande ? "text-2xl" : "text-base"}`}>{filme.publico}%</div>
          {grande && <div className="text-[11px] uppercase tracking-wider text-mute mt-1">Audiência</div>}
        </div>
      </div>
    </div>
  );
}

/* ---------- Pôster simulado ---------- */
function Poster({ filme, className = "" }) {
  if (filme.poster) return (
    <div className={`relative overflow-hidden bg-black ${className}`}>
      <img src={filme.poster} alt={`Cartaz de ${filme.titulo}`} className="card-poster absolute inset-0 w-full h-full object-cover" />
    </div>
  );
  const [a, b] = filme.cores;
  return (
    <div className={`relative overflow-hidden ${className}`} style={{ background: `linear-gradient(160deg, ${a} 0%, ${a} 45%, ${b} 140%)` }}>
      <div className="card-poster absolute inset-0">
        <div className="absolute -right-8 -top-8 w-40 h-40 rounded-full opacity-30" style={{ background: b }} />
        <div className="absolute left-0 right-0 bottom-0 h-1/2" style={{ background: `linear-gradient(to top, rgba(0,0,0,.75), transparent)` }} />
      </div>
      <div className="grain absolute inset-0" />
      <div className="absolute left-3 right-3 bottom-3">
        <div className="text-[10px] uppercase tracking-[.2em] text-white/70 mb-1">{filme.diretor}</div>
        <div className="font-display font-black uppercase text-white leading-[.9] text-2xl break-words">{filme.titulo}</div>
      </div>
    </div>
  );
}

/* ---------- Componentes de página ---------- */

        <a href="#topo" onClick={() => setAba("filmes")} className="flex items-center gap-2 shrink-0">
          <Tomate nota={70} size={28} />
          <span className="font-display font-black text-2xl uppercase tracking-wide">Tomatada<span className="text-tomato">.</span></span>
        </a>
        <nav className="flex gap-1 text-sm" aria-label="Seções">
          {[["filmes", "Filmes"], ["noticias", "Notícias"], ["criticos", "Críticos"]].map(([id, nome]) => (
            <button key={id} onClick={() => setAba(id)} aria-current={aba === id ? "page" : undefined}
              className={`px-3 py-1.5 rounded-full transition-colors ${aba === id ? "bg-panel text-fg font-semibold" : "text-mute hover:text-fg"}`}>{nome}</button>
          ))}
        </nav>
        <form className="flex-1 min-w-[200px]" onSubmit={e => e.preventDefault()} role="search">
          <label htmlFor="busca" className="sr-only">Buscar filmes</label>
          <div className="flex items-center gap-2 bg-panel border border-line rounded-full px-4 py-2 focus-within:border-corn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--mute)" strokeWidth="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="M20 20l-4-4" /></svg>
            <input id="busca" value={busca} onChange={e => setBusca(e.target.value)} placeholder={aba === "noticias" ? "Buscar notícias" : aba === "criticos" ? "Buscar críticos" : "Buscar por título, diretor ou gênero"} className="bg-transparent outline-none flex-1 min-w-0 text-sm placeholder:text-mute" />
            {busca && <button type="button" onClick={() => setBusca("")} className="text-mute hover:text-fg text-xs uppercase tracking-wider">Limpar</button>}
          </div>
        </form>

const GRADE = {
  2: {
    "Shopping Dom Pedro": [["2D Legendado", ["14:10", "17:30", "20:50"]], ["3D Dublado", ["13:00", "16:20"]]],
    "Shopping Iguatemi": [["2D Legendado", ["15:00", "18:15", "21:30"]]],

    "Shopping Galleria": [["2D Legendado", ["17:40", "20:30"]]],
  },
};

const MELHOR_TOMATOMETRO = FILMES.filter(f => f.emCartaz).reduce((a, b) => b.critica > a.critica ? b : a).id;

function diasDeSessao() {
  const hoje = new Date();
  return [0, 1, 2].map(n => {
    const d = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate() + n);
    const semana = d.toLocaleDateString("pt-BR", { weekday: "short" }).replace(".", "");
    const data = d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });
    return { n, rotulo: n === 0 ? "Hoje" : n === 1 ? "Amanhã" : semana.charAt(0).toUpperCase() + semana.slice(1), data };
  });
}

// estado de cada sessão: "esgotado", "ultimos" ou "livre"
function statusSessao(filmeId, dia, cinema, hora) {
  if (filmeId === MELHOR_TOMATOMETRO && dia === 0) return "esgotado";
  const chave = `${filmeId}${dia}${cinema}${hora}`;
  let h = 0;
  for (const c of chave) h = (h * 31 + c.charCodeAt(0)) % 997;
  if (h % 9 === 0) return "esgotado";
  if (h % 4 === 0) return "ultimos";
  return "livre";
}

function Sessoes({ filme }) {
  const [dia, setDia] = useState(0);
  const dias = diasDeSessao();
  const grade = GRADE[filme.id];
  if (!filme.emCartaz || !grade) {
    return <p className="text-sm text-mute">Este filme não está mais em cartaz nos cinemas de Campinas.</p>;
  }
  const tudoEsgotado = filme.id === MELHOR_TOMATOMETRO && dia === 0;
  return (
    <div>
      <div className="flex gap-2 overflow-x-auto pb-1" role="tablist" aria-label="Dia da sessão">
        {dias.map(d => (
          <button key={d.n} role="tab" aria-selected={dia === d.n} onClick={() => setDia(d.n)}
            className={`shrink-0 rounded-md border px-3 py-1.5 text-left leading-tight ${dia === d.n ? "bg-fg text-ink border-fg" : "border-line text-mute hover:text-fg hover:border-fg/40"}`}>
            <div className="text-sm font-semibold">{d.rotulo}</div>
            <div className="text-[11px] nums opacity-80">{d.data}</div>
          </button>
        ))}
      </div>
      {tudoEsgotado && (
        <div className="mt-4 rounded-md border border-tomato/50 bg-tomato/10 px-4 py-3 text-sm">
          Todas as sessões de hoje estão esgotadas.
        </div>
      )}
      <div className="mt-4 flex flex-col divide-y divide-line">
        {CINEMAS.map(cinema => (
          <div key={cinema} className="py-3.5 first:pt-0">
            <div className="font-semibold text-sm">{cinema}</div>
            <div className="mt-2 flex flex-col gap-2">
              {grade[cinema].map(([formato, horas]) => (
                <div key={formato} className="flex flex-wrap items-center gap-2">
                  <span className="text-[11px] uppercase tracking-wider text-mute w-full sm:w-36 shrink-0">{formato}</span>
                  {horas.map(h => {
                    const st = statusSessao(filme.id, dia, cinema, h);
                    return (
                      <span key={h} title={st === "esgotado" ? "Sessão esgotada" : st === "ultimos" ? "Últimos lugares" : "Lugares disponíveis"}
                        className={`relative font-mono text-sm nums rounded border px-2.5 py-1 ${st === "esgotado" ? "border-line text-mute/60 line-through" : st === "ultimos" ? "border-corn/70 text-fg" : "border-line text-fg"}`}>
                        {h}
                        {st === "ultimos" && <span className="absolute -top-1 -right-1 w-2 h-2 rounded-full bg-corn" />}
                      </span>
                    );
                  })}
                </div>
              ))}
            </div>
          </div>
        ))}
      </div>
      <div className="mt-3 flex flex-wrap gap-x-5 gap-y-1 text-[11px] text-mute">
        <span className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-corn" /> Últimos lugares</span>
        <span><span className="line-through">00:00</span> Esgotada</span>
        <span>Horários fictícios</span>
      </div>
    </div>
  );
}

function App() {
  const [busca, setBusca] = useState("");
  const [soEmCartaz, setSoEmCartaz] = useState(false);
  const [melhores, setMelhores] = useState(false);
  const [genero, setGenero] = useState("Todos");
  const [ordem, setOrdem] = useState("critica");
  const [aberto, setAberto] = useState(null);
  const [aba, setAba] = useState("filmes");
  const [sessoesDe, setSessoesDe] = useState(null);
  const fecharSessoes = React.useCallback(() => setSessoesDe(null), []);
  const [noticia, setNoticia] = useState(null);
  const fecharNoticia = React.useCallback(() => setNoticia(null), []);
  const fechar = React.useCallback(() => setAberto(null), []);

  const media = f => (f.critica + f.publico) / 2;
  const destaque = FILMES.reduce((melhor, f) => media(f) > media(melhor) ? f : melhor);

  const lista = useMemo(() => {
    const q = busca.trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
    const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
    let r = FILMES.filter(f =>
      (!q || norm(f.titulo).includes(q) || norm(f.diretor).includes(q) || f.generos.some(g => norm(g).includes(q))) &&
      (!soEmCartaz || f.emCartaz) &&
      (!melhores || (f.critica >= 80 && f.publico >= 75)) &&
      (genero === "Todos" || f.generos.includes(genero))
    );
    const ord = {
      critica: (a, b) => b.critica - a.critica,
      publico: (a, b) => b.publico - a.publico,
      recentes: (a, b) => b.ano - a.ano || b.critica - a.critica,
      alfabetica: (a, b) => a.titulo.localeCompare(b.titulo, "pt-BR"),
    }[ordem];
    return [...r].sort(ord);
  }, [busca, soEmCartaz, melhores, genero, ordem]);

  const filtrosAtivos = soEmCartaz || melhores || genero !== "Todos" || busca;
  const limpar = () => { setBusca(""); setSoEmCartaz(false); setMelhores(false); setGenero("Todos"); };

  return (
    <div className="min-h-screen">
      <Cabecalho busca={busca} setBusca={setBusca} aba={aba} setAba={setAba} />
      {!busca && aba === "filmes" && <Destaque filme={destaque} onAbrir={setAberto} onSessoes={setSessoesDe} />}

      {aba === "criticos" ? <PaginaCriticos busca={busca} onAbrirFilme={setAberto} /> : aba === "noticias" ? <PaginaNoticias busca={busca} onAbrir={setNoticia} /> : (
      <main className="gutter max-w-7xl mx-auto py-8">
        <div className="flex flex-wrap items-end justify-between gap-4 mb-5">
          <div>
            <h2 className="font-display font-extrabold uppercase text-3xl tracking-wide">{busca ? `Resultados para “${busca}”` : "Catálogo"}</h2>
            <p className="text-sm text-mute nums">{lista.length} {lista.length === 1 ? "filme" : "filmes"}</p>
          </div>
          <div className="flex items-center gap-2 text-sm">
            <label htmlFor="ordem" className="text-mute">Ordenar por</label>
            <select id="ordem" value={ordem} onChange={e => setOrdem(e.target.value)} className="bg-panel border border-line rounded-md px-2 py-1.5">
              <option value="critica">Tomatômetro</option>
              <option value="publico">Audiência</option>
              <option value="recentes">Mais recentes</option>
              <option value="alfabetica">Ordem alfabética (A a Z)</option>
            </select>
          </div>
        </div>

        <div className="flex flex-col gap-3 mb-8 pb-5 border-b border-line">
          <div className="flex flex-wrap gap-2">
            <Chip ativo={soEmCartaz} onClick={() => setSoEmCartaz(v => !v)}>Em Cartaz</Chip>
            <Chip ativo={melhores} onClick={() => setMelhores(v => !v)}>Melhores Notas</Chip>
            {filtrosAtivos && <button onClick={limpar} className="text-sm text-tomato hover:underline px-2">Limpar filtros</button>}
          </div>
          <div className="flex gap-2 overflow-x-auto pb-1" role="group" aria-label="Gênero">
            <span className="text-[11px] uppercase tracking-wider text-mute self-center mr-1 shrink-0">Gênero</span>
            {GENEROS.map(g => <Chip key={g} ativo={genero === g} onClick={() => setGenero(atual => atual === g ? "Todos" : g)}>{g}</Chip>)}
          </div>
        </div>

        {lista.length ? (
          <div className="grid grid-cols-2 lg:grid-cols-4 gap-x-4 gap-y-8">
            {lista.map(f => <Card key={f.id} filme={f} onAbrir={setAberto} />)}
          </div>
        ) : (
          <div className="py-20 text-center">
            <Tomate nota={10} size={48} />
            <p className="mt-4 font-semibold">Nenhum filme encontrado</p>
            <p className="text-sm text-mute">Tente outro termo ou remova algum filtro.</p>
            <button onClick={limpar} className="mt-4 text-sm border border-line rounded-full px-4 py-2 hover:border-fg/50">Limpar filtros</button>
          </div>
        )}

        <footer className="mt-16 pt-6 border-t border-line text-xs text-mute flex flex-wrap gap-x-6 gap-y-2">
          <span className="flex items-center gap-1.5"><Tomate nota={90} size={16} /> Certificado de Frescor: 75% ou mais (selo supremo de aclamação da imprensa)</span>
          <span className="flex items-center gap-1.5"><Tomate nota={65} size={16} /> Fresco: 60% a 74% (aprovado pela maioria dos críticos)</span>
          <span className="flex items-center gap-1.5"><Tomate nota={30} size={16} /> Podre: abaixo de 60% (não recomendado pela crítica)</span>
          <span className="flex items-center gap-1.5"><Pipoca nota={90} size={16} /> Audiência: % do público que gostou</span>
          <p className="basis-full w-full mt-3 rounded-md bg-[#043B40] border border-[#145E64] px-4 py-3 text-sm text-white font-bold italic leading-relaxed text-center">Catálogo conceitual: as produções, notas da crítica e da audiência fazem parte de uma simulação criativa.</p>
        </footer>
      </main>)}
      {noticia && <NoticiaModal noticia={noticia} onClose={fecharNoticia} onAbrirFilme={f => { setNoticia(null); setAberto(f); }} />}
      {aberto && <Modal filme={aberto} onClose={fechar} onVerSessoes={setSessoesDe} bloqueado={!!sessoesDe} />}
      {sessoesDe && <SessoesModal filme={sessoesDe} onClose={fecharSessoes} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body>
</html>
